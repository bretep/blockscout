# NATS Server Configuration for BlockScout
#
# This configuration enables JetStream for message persistence,
# allowing API servers to replay recent messages on startup.

# Server identification
server_name: blockscout-nats

# Client connections
port: 4222
max_connections: 1000

# HTTP monitoring
http_port: 8222

# Logging
debug: false
trace: false
logtime: true

# JetStream configuration (required for message replay)
jetstream {
  # Storage directory for JetStream data
  store_dir: /data/jetstream

  # Memory storage limit (for in-memory streams)
  max_memory_store: 256MB

  # File storage limit (if using file-based streams)
  max_file_store: 1GB
}

# Connection limits
max_payload: 8MB
max_pending: 64MB

# Timeouts
ping_interval: 30s
ping_max: 3
write_deadline: 10s
